# Module: qemu_lightning.reactos.peripherals
# Purpose: Provide network and sound devices supported by bundled ReactOS drivers.
# Created: 2026-10-22
# Architecture: QEMU reads this preset; RTL8139/NAT and AC97/PulseAudio own I/O.
# Choose a free PCI address or a unique MAC through -set when a VM needs it.

[netdev "reactosnat"]
  type = "user"
  ipv6 = "off"

[device "reactosnet"]
  driver = "rtl8139"
  netdev = "reactosnat"

[audiodev "reactosaudio"]
  driver = "pa"

[device "reactossound"]
  driver = "AC97"
  audiodev = "reactosaudio"
