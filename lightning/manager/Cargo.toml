# Module: lightning.manager.package
# Purpose: Build the native GTK 3 manager and its QMP management layer.
# Created: 2026-10-08
# Architecture: Independent Rust workspace; QEMU remains the hypervisor.
[package]
name = "lightning-manager"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "qemu-lightning-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
gtk = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
libc = "0.2"
tempfile = "3.0"

[dependencies.lightning-guest-packages]
path = "../guest-packages"

[profile.release]
debug = 0
strip = "debuginfo"
