# Module: qemu_lightning.opengl.cross_i386
# Purpose: Build the real Mesa x86 WGL frontend for 32-bit applications.
# Created: 2026-10-21
# Architecture: Requires a separate native 32-bit Venus ICD and transport.
[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
windres = 'i686-w64-mingw32-windres'
strip = 'i686-w64-mingw32-strip'
pkg-config = '/usr/bin/false'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
