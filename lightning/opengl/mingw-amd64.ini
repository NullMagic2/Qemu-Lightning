# Module: qemu_lightning.opengl.cross
# Purpose: Build the unmodified Mesa Windows WGL frontend using GCC 13.
# Created: 2026-10-21
# Architecture: x64 Vulkan/Venus guest dependency; not a ReactOS i386 driver.
[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
windres = 'x86_64-w64-mingw32-windres'
strip = 'x86_64-w64-mingw32-strip'
pkg-config = '/usr/bin/false'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
